<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>控制台</title>
<style>
  :root { --bg:#0a0f18; --panel:#111826; --line:#1f2a3c; --txt:#dbe4f0; --sub:#7c8aa0;
          --cyan:#38bdf8; --ok:#22c55e; --err:#ef4444; --warn:#f59e0b;
          --common:#9aa7b8; --uncommon:#4ade80; --rare:#60a5fa; --epic:#c084fc; --legendary:#fbbf24; --mythic:#f472b6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; min-height:100vh; }
  button { font:inherit; cursor:pointer; }
  /* 主界面 */
  #app { display:block; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; }
  header .stat { color:var(--sub); font-size:12px; }
  header .refresh { padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--txt); }
  header a.refresh { text-decoration:none; display:inline-block; margin-left:auto; }
  header .refresh.mla { margin-left:0; }
  header .refresh.acc { border-color:#2b4a63; color:var(--cyan); }
  #wrap { display:flex; height:calc(100vh - 53px); }
  /* 左列 */
  #list-col { width:300px; min-width:220px; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #search { margin:10px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#0d1420; color:var(--txt); outline:none; }
  #plist { overflow-y:auto; flex:1; }
  .prow { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .prow:hover { background:#141c2c; }
  .prow.sel { background:#16223a; border-left:3px solid var(--cyan); }
  .prow .pn { font-weight:700; }
  .prow .pm { color:var(--sub); font-size:12px; }
  /* 右侧详情 */
  #detail { flex:1; overflow-y:auto; padding:16px 20px; }
  .empty { color:var(--sub); padding:40px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:14px; margin-bottom:10px; color:var(--cyan); }
  .kv { display:flex; flex-wrap:wrap; gap:8px 20px; color:var(--sub); font-size:13px; margin-bottom:8px; }
  .kv b { color:var(--txt); }
  .money-edit { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .money-edit input { width:130px; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:#0d1420; color:var(--txt); outline:none; }
  .btn { padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:#182238; color:var(--txt); }
  .btn.pri { background:var(--cyan); border-color:var(--cyan); color:#04121c; font-weight:700; }
  .btn.warn { background:transparent; border-color:var(--warn); color:var(--warn); }
  .btn.danger { background:transparent; border-color:var(--err); color:var(--err); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .item { display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:8px; margin-bottom:4px; background:#0d1420; font-size:13px; }
  .item .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .vl { color:var(--sub); }
  .item button { padding:3px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--sub); font-size:12px; }
  .item button:hover { color:var(--txt); border-color:var(--cyan); }
  /* 仓库物品格子（游戏风格） */
  .stash-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:8px; }
  .tile { position:relative; background:#0d1420; border:2px solid var(--line); border-radius:10px;
          padding:10px 8px 8px; cursor:pointer; min-height:74px; }
  .tile:hover { background:#111a2b; }
  .tile.selk { outline:2px solid var(--cyan); outline-offset:1px; background:#121d31; }
  .tile .tn { font-size:12px; line-height:1.25; min-height:30px; word-break:break-all;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tile .tv { font-size:11px; color:var(--sub); margin-top:2px; }
  .tile .tp { font-size:11px; color:var(--sub); }
  .tile .bdg { position:absolute; top:4px; right:6px; font-size:10px; color:var(--sub);
               background:#182238; border-radius:8px; padding:0 6px; }
  .b-common { border-color:#3a4554; } .b-uncommon { border-color:#2c6e45; } .b-rare { border-color:#2d5385; }
  .b-epic { border-color:#5d3a85; } .b-legendary { border-color:#8a6a1d; } .b-mythic { border-color:#833d63; }
  .tile-act { margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
              background:#0d1420; display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .tile-act .sn { flex:1; min-width:120px; }
  .r-common { color:var(--common); } .r-uncommon { color:var(--uncommon); } .r-rare { color:var(--rare); }
  .r-epic { color:var(--epic); } .r-legendary { color:var(--legendary); } .r-mythic { color:var(--mythic); }
  .add-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .add-row select { max-width:340px; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:#0d1420; color:var(--txt); outline:none; }
  .add-row input { width:64px; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:#0d1420; color:var(--txt); outline:none; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#182238; border:1px solid var(--line);
           color:var(--txt); padding:9px 18px; border-radius:10px; font-size:13px; display:none; z-index:200; max-width:80vw; }
  #toast.ok { border-color:var(--ok); color:var(--ok); }
  #toast.err { border-color:var(--err); color:var(--err); }
  .lbl-sub { color:var(--sub); font-size:12px; margin:10px 0 6px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:20px; font-size:11px; border:1px solid var(--line); color:var(--sub); }
  .pill.on { border-color:#2c6e45; color:#4ade80; }
  .pill.off { border-color:#3a4554; color:#7c8aa0; }
  .pill.key { border-color:#8a6a1d; color:#fbbf24; }
  .bd-row { display:flex; align-items:center; gap:10px; padding:8px 12px; border:1px solid var(--line);
            border-radius:10px; background:#0d1420; margin-bottom:8px; flex-wrap:wrap; }
  .bd-row .t { flex:1; min-width:150px; font-size:13px; }
  .bd-row .t small { display:block; color:var(--sub); font-size:11.5px; font-weight:400; margin-top:2px; }
  /* ---------- 源码编辑器 ---------- */
  .srcmask { position:fixed; inset:0; background:rgba(4,8,14,.94); z-index:150; display:none; }
  .srcmask.on { display:flex; }
  .srcwin { flex:1; display:flex; flex-direction:column; margin:10px; background:var(--panel);
            border:1px solid var(--line); border-radius:12px; overflow:hidden; min-height:0; }
  .srcbar { display:flex; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .srcbar b.t { font-size:13px; letter-spacing:.06em; color:var(--cyan); }
  .srcbar select, .srcbar input { padding:6px 8px; border-radius:7px; border:1px solid var(--line);
            background:#0d1420; color:var(--txt); outline:none; font-size:12px; }
  .srcbar button { padding:6px 11px; border-radius:7px; border:1px solid var(--line); background:#182238;
            color:var(--txt); font-size:12px; }
  .srcbar button:hover { border-color:var(--cyan); }
  .srcbar button.pri { background:var(--cyan); border-color:var(--cyan); color:#04121c; font-weight:700; }
  .srcbar .sp { flex:1; }
  .srcbody { flex:1; display:flex; min-height:0; background:#070c14; }
  .srcroute { display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px solid var(--line);
              background:#0e1727; flex-wrap:wrap; font-size:12px; color:var(--sub); }
  .srcroute .rt b { color:var(--cyan); }
  .srcroute select { padding:6px 8px; border-radius:7px; border:1px solid #2b4a63; background:#0d1420;
              color:var(--txt); outline:none; font-size:12px; max-width:330px; }
  .srcroute button { padding:6px 12px; border-radius:7px; border:1px solid #2b4a63; background:#16283c;
              color:var(--cyan); font-size:12px; }
  .srcroute .rs { font-size:11.5px; }
  .srcroute .rs.ok { color:var(--ok); } .srcroute .rs.err { color:var(--err); }
  .srcroute .rh { font-size:11px; color:#54697f; }
  .srcquick { display:flex; align-items:center; gap:8px; padding:6px 10px; border-bottom:1px solid var(--line);
              background:#0b1322; flex-wrap:wrap; font-size:12px; color:var(--sub); }
  .srcquick button { padding:5px 11px; border-radius:14px; border:1px solid var(--line); background:#141e30;
              color:var(--txt); font-size:12px; }
  .srcquick button:hover { border-color:var(--cyan); color:var(--cyan); }
  .srcquick button.cur { border-color:var(--cyan); color:var(--cyan); background:#10283c; }
  .srcquick #srcnew { border-color:#2c6e45; color:#4ade80; }
  #srcgutter { padding:8px 8px 8px 10px; text-align:right; color:#3f5570; background:#0a111f;
               font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
               overflow:hidden; user-select:none; border-right:1px solid var(--line); margin:0; }
  #srcta { flex:1; margin:0; padding:8px; border:0; outline:none; resize:none; background:transparent;
           color:#cfe0f2; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
           white-space:pre; overflow:auto; tab-size:2; }
  .srcfoot { display:flex; gap:14px; align-items:center; padding:6px 10px; border-top:1px solid var(--line);
             font-size:12px; color:var(--sub); flex-wrap:wrap; }
  #srcmsg.ok { color:var(--ok); } #srcmsg.err { color:var(--err); } #srcmsg { color:var(--sub); }
  /* 口令门 */
  .gatebox { margin:auto; width:min(360px,92vw); background:var(--panel); border:1px solid var(--line);
             border-radius:14px; padding:24px; }
  .gatebox h2 { font-size:15px; margin-bottom:4px; }
  .gatebox p { color:var(--sub); font-size:12px; margin-bottom:14px; line-height:1.6; }
  .gatebox input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
                   background:#0d1420; color:var(--txt); outline:none; letter-spacing:3px; }
  .gatebox input:focus { border-color:var(--cyan); }
  .gatebox .row { display:flex; gap:8px; margin-top:12px; }
  .gatebox .row button { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line);
                   background:#182238; color:var(--txt); }
  .gatebox .row button.pri { background:var(--cyan); border-color:var(--cyan); color:#04121c; font-weight:700; }
  .gatebox .msg { min-height:18px; font-size:12px; margin-top:10px; color:var(--err); }
  @media (max-width:760px) {
    #wrap { flex-direction:column; }
    #list-col { width:100%; max-height:42vh; border-right:0; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>开发者控制台 <span class="stat" id="hdr-ver"></span></h1>
    <span class="stat" id="hdr-stat">加载中…</span>
    <a class="refresh" href="/game.html" target="_blank">返回游戏</a>
    <button class="refresh mla acc" id="btn-src" type="button">⌨ 源码</button>
    <button class="refresh mla" id="btn-upd" type="button">⇡ 检查更新</button>
    <button class="refresh mla" id="btn-refresh" type="button">↻ 刷新</button>
  </header>
  <div id="wrap">
    <div id="list-col">
      <input id="search" placeholder="搜索昵称…" autocomplete="off">
      <div id="plist"><div class="empty">加载中…</div></div>
    </div>
    <div id="detail"><div class="empty">← 左侧选择一名玩家</div></div>
  </div>
</div>

<!-- 源码编辑器 -->
<div class="srcmask" id="srcmask">
  <div class="srcwin">
    <div class="srcbar">
      <b class="t">源码编辑</b>
      <select id="srcfile"><option value="S1.html">S1.html · 源头赛季</option></select>
      <button id="srcpull" type="button">↻ 拉取线上</button>
      <button id="srccheck" type="button">✓ 语法检查</button>
      <button id="srcfind" type="button">🔍 查找替换</button>
      <button id="srcdl" type="button">⬇ 导出文件</button>
      <span class="sp"></span>
      <input id="srctok" type="password" placeholder="GitHub Token（存本机）" style="width:190px" autocomplete="off">
      <button id="srcpush" class="pri" type="button">⤴ 同步到线上</button>
      <button id="srcclose" type="button">✕</button>
    </div>
    <div class="srcroute">
      <span class="rt">正式网址 <b>/</b> 打开：</span>
      <select id="routefile"><option value="">读取中…</option></select>
      <button id="routeapply" type="button">应用</button>
      <span id="routestat" class="rs">—</span>
      <span class="sp" style="flex:1"></span>
      <span class="rh">改完立即生效 · 全服玩家下次打开就进这个文件</span>
    </div>
    <div class="srcquick">
      <span class="qt">快速切换：</span>
      <button type="button" data-qf="S1.html">源头 S1</button>
      <button type="button" data-qf="game.html">正式服 game</button>
      <button type="button" data-qf="index.html">入口页 index</button>
      <span class="sp" style="flex:1"></span>
      <button id="srcnew" type="button">➕ 新建 HTML</button>
    </div>
    <div class="srcbody">
      <pre id="srcgutter"></pre>
      <textarea id="srcta" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off"></textarea>
    </div>
    <div class="srcfoot">
      <span id="srcstat">未加载</span>
      <span id="srcmsg"></span>
      <span class="sp" style="flex:1"></span>
      <span style="color:#54697f">同步走 GitHub → Pages 自动重建，约 30~90 秒生效</span>
    </div>
  </div>
</div>

<!-- 源码口令门 -->
<div class="srcmask" id="srcgate">
  <div class="gatebox">
    <h2>主策划验证</h2>
    <p>源码编辑仅限主策划。口令通过后可查看并修改全部源码。<br>建议从游戏网址打开本页；在聊天预览里打开只能看代码，不能同步。</p>
    <input id="srcpass" type="password" placeholder="进入口令" autocomplete="off">
    <div class="row">
      <button id="srcgate-cancel" type="button">取消</button>
      <button id="srcgate-ok" class="pri" type="button">验证并进入</button>
    </div>
    <div class="msg" id="srcgate-msg"></div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';
  /* 控制台自身版本号 —— 每次改完 dev.html 记得同步改这里，玩家端「检查更新」靠它对比 */
  var DEV_VERSION = 'W16.99c';
  /* ---------- 后端（与游戏同一套 anon 通道） ---------- */
  var SB_URL = 'https://a189ce61ac0be9d3b.app.workbuddy.host';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ1bmJhc2UiLCJyb2xlIjoiYW5vbiIsInByb2plY3QiOiJwXzdmNDFjZWY5ZWEwNCIsInJlZiI6ImIxZWU0ZjRlNTkwMSIsImlhdCI6MTc5NDgzMjk0MX0.vCVpMj1yW-uv2uum4H5DBI5uQ7yc6S1DqFMAG6Mhj1k';
  var SB_SHARE = 'DRZDPQLGJC';

  function api(path, opts) {
    opts = opts || {};
    var h = { 'apikey': SB_KEY, 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SB_KEY };
    for (var k in (opts.headers || {})) h[k] = opts.headers[k];
    if (path.indexOf('?') >= 0) path += '&sharecode=' + SB_SHARE; else path += '?sharecode=' + SB_SHARE;
    var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 15000) : null;
    return fetch(SB_URL + path, { method: opts.method || 'GET', headers: h, body: opts.body || undefined, signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        return r.text().then(function (t) {
          if (timer) clearTimeout(timer);
          var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) { d = t; }
          if (!r.ok) { var m = (d && (d.message || d.msg || d.hint)) || ('HTTP ' + r.status); throw new Error(m); }
          return fixRows(d);
        });
      }).catch(function (e) { if (timer) clearTimeout(timer); throw e; });
  }
  /* unbase 会把 JSON 列以字符串返回 —— 和游戏内 sbFixRows 一样兜底解析 */
  var JSON_COLS = ['data', 'gear_json', 'ai_json'];
  function fixRows(d) {
    if (!d) return d;
    var arr = (d instanceof Array) ? d : [d];
    for (var i = 0; i < arr.length; i++) {
      var r = arr[i];
      if (!r || typeof r !== 'object') continue;
      for (var c in JSON_COLS) {
        var v = r[JSON_COLS[c]];
        if (typeof v === 'string' && v && (v.charAt(0) === '{' || v.charAt(0) === '[')) {
          try { r[JSON_COLS[c]] = JSON.parse(v); } catch (e) {}
        } else if (v === '') { r[JSON_COLS[c]] = null; }
      }
    }
    return d;
  }

  /* ---------- 账号密码工具（与游戏 ubHash 完全一致的 PBKDF2-SHA256） ---------- */
  function ubB64(buf) { var s = '', u = new Uint8Array(buf); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function ubUnb64(str) { var bin = atob(str), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function ubSalt() { var u = new Uint8Array(16); (crypto.getRandomValues ? crypto.getRandomValues(u) : u.forEach(function (_, i) { u[i] = Math.random() * 256 | 0; })); return ubB64(u); }
  function ubHash(pw, salt) {
    if (!(window.crypto && crypto.subtle)) {
      var h1 = 0x811c9dc5 | 0, salt2 = ubUnb64(salt);
      for (var r = 0; r < 20000; r++) {
        for (var i = 0; i < pw.length; i++) { h1 ^= pw.charCodeAt(i) + r; h1 = (h1 + ((h1 << 1) + (h1 << 4) + (h1 << 7) + (h1 << 8) + (h1 << 24))) >>> 0; }
        for (var j = 0; j < salt2.length; j++) { h1 ^= salt2[j]; h1 = (h1 + ((h1 << 1) + (h1 << 4) + (h1 << 7) + (h1 << 8) + (h1 << 24))) >>> 0; }
      }
      return Promise.resolve('w' + (h1 >>> 0).toString(16) + '-' + pw.length + '-' + salt.length);
    }
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: ubUnb64(salt), iterations: 120000, hash: 'SHA-256' }, k, 256); })
      .then(ubB64);
  }

  function toast(txt, cls) {
    var t = document.getElementById('toast');
    t.textContent = txt; t.className = cls || ''; t.style.display = 'block';
    clearTimeout(t._tm); t._tm = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function gnum(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  var enc = encodeURIComponent;

  /* ---------- 物品定义：运行时从 game.html 提取，永远跟游戏同步 ---------- */
  var DEFS = [];
  function loadDefs() {
    return fetch('/game.html?t=' + Date.now()).then(function (r) { return r.text(); }).then(function (html) {
      var m = html.match(/var ITEM_DEFS = \[[\s\S]*?\n\];/);
      if (!m) throw new Error('defs not found');
      (0, eval)(m[0] + '; window.__DEV_ITEM_DEFS = ITEM_DEFS;');
      DEFS = window.__DEV_ITEM_DEFS || [];
      if (!DEFS.length) throw new Error('defs empty');
    }).catch(function (e) { DEFS = []; console.warn('[dev] 物品定义加载失败:', e && e.message); });
  }
  function defByName(n) { for (var i = 0; i < DEFS.length; i++) if (DEFS[i].name === n) return DEFS[i]; return null; }
  /* 从定义造一条仓库物品（和游戏 serItem 的序列化字段一致） */
  function serFromDef(d) {
    return { n: d.name, r: d.rarity, v: d.value, k: d.kind, e: d.equip || null,
             a: d.armor || 0, b: d.slotBonus || 0, h: d.heal || 0, l: d.look || null, s: d.secure || 0 };
  }

  /* ---------- 数据 ---------- */
  var players = [], sel = null, filter = '', selKey = '';
  function selItem(merged) {
    for (var i = 0; i < merged.length; i++) if (merged[i].key === selKey) return merged[i];
    return { n: '?', r: 'common', cnt: 0 };
  }

  /* 网络重试：手机弱网下云端请求偶发 Failed to fetch，自动补试 2 次 */
  function withRetry(fn, n) {
    var tries = 0;
    function attempt() {
      tries++;
      return fn().catch(function (e) {
        if (tries >= n) throw e;
        return new Promise(function (res) { setTimeout(res, 1200 * tries); }).then(attempt);
      });
    }
    return attempt();
  }

  function fetchAll() {
    setStatus('加载中…');
    return withRetry(function () {
      return Promise.all([
        api('/rest/v1/users?select=uid,nick,v,salt,hash&order=nick.asc'),
        api('/rest/v1/saves?select=user_id,data,updated_at'),
        api('/rest/v1/user_nicks?select=uid,nick').catch(function () { return []; }),
        api('/rest/v1/leaderboard?select=user_id,nick,total,money,kills,extracts').catch(function () { return []; })
      ]);
    }, 3).then(function (r) {
      var users = r[0] || [], saves = r[1] || [], nicks = r[2] || [], lb = r[3] || [];
      var map = {}, nickRows = {};
      users.forEach(function (u) { map[u.uid] = { uid: u.uid, nick: u.nick, hasAcct: true, acct: u, save: null, lb: null }; });
      nicks.forEach(function (n) {
        nickRows[n.uid] = n.nick;
        if (!map[n.uid]) map[n.uid] = { uid: n.uid, nick: n.nick, hasAcct: false, save: null, lb: null };
      });
      saves.forEach(function (s) {
        if (!map[s.user_id]) map[s.user_id] = { uid: s.user_id, nick: null, hasAcct: false, save: null, lb: null };
        map[s.user_id].save = s;
      });
      lb.forEach(function (l) { if (map[l.user_id]) map[l.user_id].lb = l; else if (!map[l.user_id]) map[l.user_id] = { uid: l.user_id, nick: l.nick, hasAcct: false, save: null, lb: l }; });
      players = Object.keys(map).filter(function (k) { return k.indexOf('__') !== 0; }).map(function (k) {
        var p = map[k];
        if (!p.nick && p.save && p.save.data && p.save.data.nick) p.nick = p.save.data.nick;
        if (!p.nick) p.nick = '未知玩家';
        p.hasNickRow = !!nickRows[p.uid];
        p.stash = (p.save && p.save.data && p.save.data.stash) || [];
        p.money = (p.save && p.save.data && typeof p.save.data.money === 'number') ? p.save.data.money : null;
        if (sel) {
          /* 刷新后保持选中项数据最新 */
          if (sel.uid === p.uid) { p._fr = sel._fr; p._frState = sel._frState; sel = p; }
        }
        return p;
      }).sort(function (a, b) { return a.nick.localeCompare(b.nick, 'zh'); });
      renderList();
      if (sel) renderDetail();
      setStatus(players.length + ' 名玩家');
    }).catch(function (e) {
      var m = /fetch/i.test(String(e.message)) ? '网络打不到云端（点右上角「↻ 刷新」重试）' : e.message;
      setStatus('加载失败：' + m);
      toast('加载失败：' + m, 'err');
    });
  }
  function setStatus(s) { document.getElementById('hdr-stat').textContent = s; }

  function renderList() {
    var box = document.getElementById('plist');
    var kw = filter.trim().toLowerCase();
    var rows = players.filter(function (p) { return !kw || (p.nick || '').toLowerCase().indexOf(kw) >= 0; });
    if (!rows.length) { box.innerHTML = '<div class="empty">没有匹配的玩家</div>'; return; }
    box.innerHTML = rows.map(function (p) {
      return '<div class="prow' + (sel && sel.uid === p.uid ? ' sel' : '') + '" data-uid="' + esc(p.uid) + '">' +
        '<div class="pn">' + esc(p.nick) + (p.hasAcct ? '' : ' <span style="color:var(--sub);font-size:11px">(无账号)</span>') + '</div>' +
        '<div class="pm">仓库 ' + p.stash.length + ' 件 · ' + (p.money == null ? '无存档' : '$' + gnum(p.money)) + (p.lb ? ' · 榜' : '') + '</div>' +
      '</div>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.prow'), function (el) {
      el.addEventListener('click', function () {
        sel = players.filter(function (p) { return p.uid === el.getAttribute('data-uid'); })[0] || null;
        selKey = '';
        renderList(); renderDetail();
      });
    });
  }

  function stashItemRow(it, idx) {
    if (!it) return '';
    return '<div class="item">' +
      '<span class="nm r-' + esc(it.r) + '">' + esc(it.n) + ' <span style="color:var(--sub)">×' + (it.cnt || 1) + '</span></span>' +
      '<span class="vl">$' + gnum(it.v) + '</span>' +
      '<button data-act="plus" data-idx="' + idx + '" type="button">+1</button>' +
      '<button data-act="minus" data-idx="' + idx + '" type="button">移除</button>' +
    '</div>';
  }
  /* 把相同物品合并显示 —— W16.85：同名同品阶合并成一行（不管单件价值差多少），
     价值显示合计 */
  function mergeStash(stash) {
    var out = [], keyMap = {};
    stash.forEach(function (it, i) {
      if (!it) return;
      var k = it.n + '|' + it.r;
      if (keyMap[k] == null) {
        keyMap[k] = out.length;
        var o = Object.assign({ idx: i, cnt: 1, total: it.v || 0, key: k }, it);
        out.push(o);
      } else { out[keyMap[k]].cnt++; out[keyMap[k]].total += (it.v || 0); }
    });
    return out;
  }

  /* ---------- 名单管理：玩家都躺在哪些表里 ---------- */
  function ensureFriends(p) {
    if (p._frState) return;
    p._frState = 'loading';
    api('/rest/v1/friends?or=(owner.eq.' + enc(p.uid) + ',friend.eq.' + enc(p.uid) + ')&select=owner,friend')
      .then(function (list) { p._fr = list || []; p._frState = 'done'; if (sel && sel.uid === p.uid) renderDetail(); })
      .catch(function () { p._fr = []; p._frState = 'done'; if (sel && sel.uid === p.uid) renderDetail(); });
  }
  function nickOf(uid) {
    if (sel && uid === sel.uid) return sel.nick;
    for (var i = 0; i < players.length; i++) if (players[i].uid === uid) return players[i].nick;
    return uid.length > 12 ? uid.slice(0, 10) + '…' : uid;
  }
  function listCard(p) {
    var lb = p.lb || null;
    var fr = p._fr;
    var frRows;
    if (p._frState === 'loading' || !p._frState) {
      frRows = '<div class="lbl-sub">好友关系读取中…</div>';
    } else if (!fr || !fr.length) {
      frRows = '<div class="lbl-sub">没有任何好友关系记录</div>';
    } else {
      frRows = fr.map(function (f) {
        var mine = (f.owner === p.uid);
        var other = mine ? f.friend : f.owner;
        return '<div class="item">' +
          '<span class="nm">' + esc(nickOf(other)) + '</span>' +
          '<span class="vl">' + (mine ? '他 → 我（我加的他）' : '我 → 他（他加的我）') + '</span>' +
          '<button data-act="frdel" data-owner="' + esc(f.owner) + '" data-friend="' + esc(f.friend) + '" type="button">解除</button>' +
        '</div>';
      }).join('');
    }

    return '<div class="card">' +
      '<h2>名单管理 · 玩家所在的数据表</h2>' +
      '<div class="bd-row">' +
        '<span class="t">排行榜 <small>leaderboard · 排名与战绩</small></span>' +
        (lb ? '<span class="pill key">在榜 · ' + (lb.total || 0) + ' 场 / ' + (lb.kills || 0) + ' 杀</span>' +
              '<button class="btn warn" data-act="lbdrop" type="button">移出排行榜</button>'
            : '<span class="pill off">不在排行榜</span>') +
      '</div>' +
      '<div class="bd-row">' +
        '<span class="t">昵称表 <small>user_nicks · 加好友搜索用的候选池</small></span>' +
        (p.hasNickRow ? '<span class="pill on">有记录</span><button class="btn warn" data-act="nickdrop" type="button">移除记录</button>'
                      : '<span class="pill off">无记录</span>') +
      '</div>' +
      '<div class="bd-row">' +
        '<span class="t">好友列表 <small>friends · 双向好友关系</small></span>' +
        '<span class="pill ' + (fr && fr.length ? 'on' : 'off') + '">' + (fr ? fr.length : 0) + ' 条关系</span>' +
        (fr && fr.length ? '<button class="btn danger" data-act="frclear" type="button">全部解除</button>' : '') +
      '</div>' +
      '<div class="lbl-sub">好友明细</div>' + frRows +
      '<div class="bd-row" style="margin-top:10px">' +
        '<span class="t">私聊记录 <small>messages · 该玩家收发的全部消息</small></span>' +
        '<button class="btn warn" data-act="msgclear" type="button">清空私聊</button>' +
      '</div>' +
    '</div>';
  }

  function renderDetail() {
    var box = document.getElementById('detail');
    if (!sel) { box.innerHTML = '<div class="empty">← 左侧选择一名玩家</div>'; return; }
    var p = sel, sv = p.save && p.save.data ? p.save.data : null;
    var eq = sv && sv.equip ? sv.equip : {};
    var st = sv && sv.stats ? sv.stats : {};
    var lb = p.lb || {};
    var merged = mergeStash(p.stash || []);
    ensureFriends(p);
    /* W16.85：仓库改成游戏风格的物品格子，点选一个物品在下方操作 */
    var itemsHtml = merged.length
      ? '<div class="stash-grid">' + merged.map(function (it) {
          return '<div class="tile b-' + esc(it.r) + (selKey === it.key ? ' selk' : '') + '" data-key="' + esc(it.key) + '">' +
            '<span class="bdg">×' + it.cnt + '</span>' +
            '<div class="tn r-' + esc(it.r) + '">' + esc(it.n) + '</div>' +
            '<div class="tv">共 ' + it.cnt + ' 件</div>' +
            '<div class="tp">合计 $' + gnum(it.total) + '</div>' +
          '</div>';
        }).join('') + '</div>' +
        '<div class="tile-act">' +
          (selKey
            ? '<span class="sn">已选：<b class="r-' + esc(selItem(merged).r) + '">' + esc(selItem(merged).n) + '</b> ×' + selItem(merged).cnt + '</span>' +
              '<button class="btn" data-act="plus" data-key="' + esc(selKey) + '" type="button">+1</button>' +
              '<button class="btn warn" data-act="minus" data-key="' + esc(selKey) + '" type="button">-1</button>'
            : '<span class="sn" style="color:var(--sub)">点上面的物品格子进行 +1 / -1 操作</span>') +
        '</div>'
      : '<div class="lbl-sub">仓库是空的</div>';

    var opts = DEFS.map(function (d) {
      return '<option value="' + esc(d.name) + '">' + esc(d.name) + ' · ' + d.rarity + ' · $' + d.value + '</option>';
    }).join('');

    box.innerHTML =
      '<div class="card">' +
        '<h2>' + esc(p.nick) + '</h2>' +
        '<div class="kv">' +
          '<span>UID</span><b style="word-break:break-all">' + esc(p.uid) + '</b>' +
          '<span>账号</span><b>' + (p.hasAcct ? '有' : '无（仅存档）') + '</b>' +
          '<span>对局</span><b>' + (st.runs || (lb.total || 0)) + '</b>' +
          '<span>撤离</span><b>' + (st.extracts != null ? st.extracts : (lb.extracts || 0)) + '</b>' +
          '<span>击杀</span><b>' + (st.kills != null ? st.kills : (lb.kills || 0)) + '</b>' +
          '<span>经验</span><b>' + (st.xp || 0) + '</b>' +
          '<span>存档更新</span><b>' + (p.save && p.save.updated_at ? String(p.save.updated_at).replace('T', ' ').slice(0, 16) : '—') + '</b>' +
        '</div>' +
      '</div>' +
      listCard(p) +
      '<div class="card">' +
        '<h2>账号与密码</h2>' +
        (p.hasAcct
          ? '<div class="kv">' +
              '<span>密码存储</span><b>PBKDF2-SHA256 加密</b>' +
              '<span>密码原文</span><b style="color:var(--warn)">不可查看（加密单向存储）</b>' +
              '<span>密码哈希</span><b style="word-break:break-all;font-size:11px">' + esc((p.acct && p.acct.hash ? String(p.acct.hash) : '').slice(0, 14)) + '…</b>' +
            '</div>' +
            '<div class="money-edit">' +
              '<input id="npw-in" type="text" autocomplete="off" placeholder="设置新密码（至少 6 位）">' +
              '<button class="btn pri" data-act="resetpw" type="button">重置密码</button>' +
            '</div>' +
            '<div class="money-edit">' +
              '<input id="nick-in" type="text" autocomplete="off" placeholder="输入新昵称">' +
              '<button class="btn" data-act="rename" type="button">改昵称</button>' +
            '</div>'
          : '<div class="lbl-sub">该玩家没有注册账号（仅存档），无密码可管理</div>') +
      '</div>' +
      '<div class="card">' +
        '<h2>金币 · $' + gnum(p.money == null ? 0 : p.money) + '</h2>' +
        '<div class="money-edit">' +
          '<input id="money-in" type="number" placeholder="金额">' +
          '<button class="btn pri" data-act="mset" type="button">设为</button>' +
          '<button class="btn" data-act="madd" type="button">＋加</button>' +
          '<button class="btn" data-act="msub" type="button">－减</button>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>装备（身上）</h2>' +
        '<div class="kv">' +
          ['weapon|武器', 'armor|护甲', 'pack|背包', 'rig|胸挂', 'med|医疗', 'safebox|安全箱'].map(function (s2) {
            var k = s2.split('|')[0], lab = s2.split('|')[1];
            var it = eq[k];
            return '<span>' + lab + '</span><b class="' + (it ? 'r-' + esc(it.r) : '') + '">' + (it ? esc(it.n) + ' <button data-act="unequip" data-slot="' + k + '" type="button" style="margin-left:6px;padding:1px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:11px">卸下</button>' : '—') + '</b>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>仓库（' + (p.stash ? p.stash.length : 0) + ' 件）</h2>' +
        '<div class="add-row" style="margin-bottom:12px">' +
          '<select id="add-item">' + opts + '</select>' +
          '<input id="add-num" type="number" value="1" min="1">' +
          '<button class="btn pri" data-act="add" type="button">加入仓库</button>' +
        '</div>' +
        itemsHtml +
      '</div>' +
      '<div class="card">' +
        '<h2 style="color:var(--err)">危险区</h2>' +
        '<div class="lbl-sub">删除玩家将同时清除：账号、云存档、排行榜、好友关系、私聊记录、昵称表，不可恢复。</div>' +
        '<button class="btn danger" data-act="delplayer" type="button">🗑 删除该玩家</button>' +
      '</div>';

    Array.prototype.forEach.call(box.querySelectorAll('[data-act]'), function (el) {
      el.addEventListener('click', function () { onAct(el.getAttribute('data-act'), el); });
    });
    /* 物品格子点选 */
    Array.prototype.forEach.call(box.querySelectorAll('.tile[data-key]'), function (el) {
      el.addEventListener('click', function () {
        selKey = (selKey === el.getAttribute('data-key')) ? '' : el.getAttribute('data-key');
        renderDetail();
      });
    });
  }

  /* ---------- 写回存档 ---------- */
  function pushSave(p, data) {
    if (!p.save) {
      /* 玩家还没有云存档 → 建一个最小存档 */
      p.save = { user_id: p.uid, updated_at: null };
    }
    p.save.data = data;
    data.ts = Date.now();
    p.save.updated_at = new Date().toISOString();
    p.stash = data.stash || [];
    p.money = data.money;
    return api('/rest/v1/saves?on_conflict=user_id', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ user_id: p.uid, data: data, updated_at: p.save.updated_at })
    });
  }
  function ensureData(p) {
    if (p.save && p.save.data) return p.save.data;
    var d = { ver: 2, money: p.money == null ? 4500 : p.money, stash: [],
              equip: { weapon: null, armor: null, pack: null, rig: null, med: null, safebox: null },
              run: [], secure: [null, null], runActive: false,
              stats: { runs: 0, extracts: 0, kills: 0, xp: 0 }, mapId: 'radar', kindStats: {}, ts: Date.now() };
    return d;
  }

  function onAct(act, el) {
    if (!sel) return;
    var p = sel;
    if (act === 'mset' || act === 'madd' || act === 'msub') {
      var v = parseInt(document.getElementById('money-in').value, 10);
      if (isNaN(v) || v < 0) { toast('请输入有效金额', 'err'); return; }
      var d = ensureData(p);
      d.money = act === 'mset' ? v : (act === 'madd' ? (d.money || 0) + v : Math.max(0, (d.money || 0) - v));
      el.disabled = true;
      pushSave(p, d).then(function () {
        el.disabled = false; toast('金币已更新：$' + gnum(d.money), 'ok'); renderList(); renderDetail();
      }).catch(function (e) { el.disabled = false; toast('失败：' + e.message, 'err'); });

    } else if (act === 'add') {
      var name = document.getElementById('add-item').value;
      var num = Math.max(1, parseInt(document.getElementById('add-num').value, 10) || 1);
      var def = defByName(name);
      if (!def) { toast('物品定义不存在', 'err'); return; }
      var d2 = ensureData(p);
      for (var i = 0; i < num; i++) d2.stash.push(serFromDef(def));
      el.disabled = true;
      pushSave(p, d2).then(function () {
        el.disabled = false; toast('已加入 ' + name + ' ×' + num, 'ok'); renderList(); renderDetail();
      }).catch(function (e) { el.disabled = false; toast('失败：' + e.message, 'err'); });

    } else if (act === 'plus' || act === 'minus') {
      var key = el.getAttribute('data-key');
      var d3 = ensureData(p);
      var hit = false;
      for (var j = d3.stash.length - 1; j >= 0; j--) {
        var it = d3.stash[j];
        if (!it) continue;
        if ((it.n + '|' + it.r) === key) {
          hit = true;
          if (act === 'plus') { d3.stash.push(Object.assign({}, it)); break; }
          d3.stash.splice(j, 1); break;
        }
      }
      if (!hit) { toast('物品不存在', 'err'); return; }
      el.disabled = true;
      pushSave(p, d3).then(function () {
        el.disabled = false; toast(act === 'plus' ? '已 +1' : '已移除 1 件', 'ok'); renderList(); renderDetail();
      }).catch(function (e) { el.disabled = false; toast('失败：' + e.message, 'err'); });

    } else if (act === 'unequip') {
      var slot = el.getAttribute('data-slot');
      var d4 = ensureData(p);
      if (d4.equip && d4.equip[slot]) d4.equip[slot] = null;
      el.disabled = true;
      pushSave(p, d4).then(function () {
        el.disabled = false; toast('已卸下', 'ok'); renderDetail();
      }).catch(function (e) { el.disabled = false; toast('失败：' + e.message, 'err'); });

    } else if (act === 'resetpw') {
      var np = (document.getElementById('npw-in').value || '');
      if (!p.hasAcct) { toast('该玩家没有账号', 'err'); return; }
      if (np.length < 6) { toast('新密码至少 6 位', 'err'); return; }
      el.disabled = true;
      var salt = ubSalt();
      ubHash(np, salt).then(function (h) {
        return api('/rest/v1/users?uid=eq.' + enc(p.uid), { method: 'PATCH', body: JSON.stringify({ salt: salt, hash: h }) });
      }).then(function () {
        el.disabled = false;
        toast('「' + p.nick + '」的密码已重置，新密码：' + np, 'ok');
        document.getElementById('npw-in').value = '';
      }).catch(function (e) { el.disabled = false; toast('重置失败：' + e.message, 'err'); });

    } else if (act === 'rename') {
      var nn = (document.getElementById('nick-in').value || '').trim();
      if (nn.length < 2 || nn.length > 16) { toast('昵称 2~16 个字', 'err'); return; }
      if (/[@\s]/.test(nn)) { toast('昵称不能包含空格或 @', 'err'); return; }
      if (nn === p.nick) { toast('昵称没有变化', 'err'); return; }
      el.disabled = true;
      Promise.all([
        api('/rest/v1/users?uid=eq.' + enc(p.uid), { method: 'PATCH', body: JSON.stringify({ nick: nn }) }),
        api('/rest/v1/user_nicks?uid=eq.' + enc(p.uid), { method: 'PATCH', body: JSON.stringify({ nick: nn }) }).catch(function () {})
      ]).then(function () {
        el.disabled = false;
        var old = p.nick;
        p.nick = nn;
        if (p.acct) p.acct.nick = nn;
        if (p.lb) p.lb.nick = nn;
        toast('昵称已从「' + old + '」改为「' + nn + '」', 'ok');
        renderList(); renderDetail();
      }).catch(function (e) { el.disabled = false; toast('改名失败：' + e.message, 'err'); });

    /* ------- 名单管理 ------- */
    } else if (act === 'lbdrop') {
      if (!p.lb) { toast('该玩家不在排行榜', 'err'); return; }
      if (!confirm('把「' + p.nick + '」从排行榜移出？\n战绩数据会一起清掉，账号和存档不受影响。')) return;
      el.disabled = true;
      api('/rest/v1/leaderboard?user_id=eq.' + enc(p.uid), { method: 'DELETE' }).then(function () {
        el.disabled = false; p.lb = null; toast('已从排行榜移出', 'ok'); renderList(); renderDetail();
      }).catch(function (e) { el.disabled = false; toast('操作失败：' + e.message, 'err'); });

    } else if (act === 'nickdrop') {
      if (!p.hasNickRow) { toast('该玩家不在昵称表', 'err'); return; }

  var SRC_PASS = '231928zxcvbnm';                /* ← 主策划进入口令，想换就改这里 */
  var GH_REPO = 'honglang162/3';

  /* ---- base64（UTF-8 安全，FileReader 不用，直接手撸） ---- */
  function b64enc(str) {
    var u = new TextEncoder().encode(str), s = '', CH = 0x8000;
    for (var i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH));
    return btoa(s);
  }
  function b64dec(b64) {
    var bin = atob(String(b64).replace(/\s/g, '')), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(u);
  }

  /* ---- GitHub API ---- */
  function tok() { return (srcEls.tok.value || '').trim() || localStorage.getItem(TOK_LS) || ''; }
  function gh(path, opt) {
    var t = tok();
    if (!t) return Promise.reject(new Error('先填 GitHub Token'));
    opt = opt || {};
    var h = { 'Authorization': 'Bearer ' + t, 'Accept': 'application/vnd.github+json' };
    if (opt.body) h['Content-Type'] = 'application/json';
    return fetch('https://api.github.com/repos/' + GH_REPO + path, {
      method: opt.method || 'GET', headers: h, cache: 'no-store',
      body: opt.body ? JSON.stringify(opt.body) : undefined
    }).then(function (r) {
      return r.text().then(function (txt) {
        var d = null; try { d = txt ? JSON.parse(txt) : null; } catch (e) { d = txt; }
        if (!r.ok) {
          var m = (d && d.message) || ('HTTP ' + r.status);
          if (r.status === 401) m = 'Token 无效或已过期';
          if (r.status === 403) m = 'Token 没有写权限（需要 Contents: Read and write）';
          if (r.status === 404) m = 'Token 没有这个仓库的权限';
          if (r.status === 409) m = '远端刚有新提交，重试一次';
          throw new Error(m);
        }
        return d;
      });
    });
  }
  /* 读：优先 GitHub（权威），失败依次退回 同源 → raw.githubusercontent → Pages，
     保证从聊天产物预览这种隔离环境里打开也能看到源码 */
  var SRC_MIRRORS = [
    '',
    'https://honglang162.github.io/3/',
    'https://raw.githubusercontent.com/honglang162/3/master/'
  ];
  function srcPull(file) {
    srcSay('拉取中…');
    return gh('/contents/' + file + '?ref=' + GH_BRANCH).then(function (d) {
      if (!d || !d.content) throw new Error('内容为空');
      return b64dec(d.content);
    }).catch(function (e) {
      if (tok()) throw e;
      var i = 0;
      function tryNext() {
        if (i >= SRC_MIRRORS.length) {
          throw new Error('三个通道都拉不到。请检查网络，或填上 GitHub Token 再拉');
        }
        var base = SRC_MIRRORS[i++];
        srcSay('拉取中…（通道 ' + i + '/' + SRC_MIRRORS.length + '）');
        var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
        var tm = ctl ? setTimeout(function () { try { ctl.abort(); } catch (e2) {} }, 12000) : null;
        return fetch(base + file + '?t=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
          .then(function (r) {
            if (tm) clearTimeout(tm);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          }).catch(function () { if (tm) clearTimeout(tm); return tryNext(); });
      }
      return tryNext();
    });
  }
  function srcLoad(file, force) {
    if (!force && file === srcLoaded) return;
    srcEls.ta.value = '加载中…';
    srcEls.ta.disabled = true;
    srcPull(file).then(function (txt) {
      srcEls.ta.disabled = false;
      srcEls.ta.value = txt;

      srcSay('已加载 ' + file + ' · ' + kb + ' KB', 'ok');
    }).catch(function (e) {
      srcEls.ta.disabled = false;
      srcEls.ta.value = '';
      srcBase = '';
      srcRefreshGutter();
      srcSay('拉取失败：' + e.message + '（可先填 Token，或改用「导出」后的本地文件编辑）', 'err');
    });
  }

  /* 写：一次 commit 提交多个文件 */
  function ghCommit(files, message) {
    var base = null;
    return gh('/git/ref/heads/' + GH_BRANCH).then(function (ref) {
      return gh('/git/commits/' + ref.object.sha).then(function (c) {
        base = { commit: ref.object.sha, tree: c.tree.sha };
      });
    }).then(function () {
      return Promise.all(files.map(function (f) {
        return gh('/git/blobs', { method: 'POST', body: { content: b64enc(f.text), encoding: 'base64' } })
          .then(function (b) { return { path: f.path, mode: '100644', type: 'blob', sha: b.sha }; });
      }));
    }).then(function (entries) {
      return gh('/git/trees', { method: 'POST', body: { base_tree: base.tree, tree: entries } });
    }).then(function (tree) {
      return gh('/git/commits', { method: 'POST', body: { message: message, tree: tree.sha, parents: [base.commit] } });
    }).then(function (nc) {
      return gh('/git/refs/heads/' + GH_BRANCH, { method: 'PATCH', body: { sha: nc.sha, force: false } })
        .catch(function () {
          return gh('/git/refs/heads/' + GH_BRANCH, { method: 'PATCH', body: { sha: nc.sha, force: true } });
        }).then(function () { return nc; });
    });
  }

  function srcPush(btn) {

    if (text === srcBase) { srcSay('和线上完全一致，无需同步', ''); return; }
    var files = [{ path: file, text: text }];

    btn.disabled = true;

      btn.disabled = false;

      srcSay('✔ 已提交 ' + nc.sha.slice(0, 7) + ' · Pages 构建中，稍等 30~90 秒刷新游戏即可', 'ok');
      toast('已同步到线上', 'ok');

  /* 语法检查：抽出内联 script 逐块 new Function 编译，报出第一处错误 */
  function srcCheck() {
    var text = srcEls.ta.value;
    var re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi, m, bad = 0, total = 0, firstErr = '';
    var lineAt = (function () {
      var idx = 0, line = 0, cache = {};
      return function (pos) { return text.slice(0, pos).split('\n').length; };
    })();
    while ((m = re.exec(text))) {
      if (/\bsrc\s*=/.test(m[1])) continue;
      if (!m[2] || !m[2].trim()) continue;
      total++;
      try { new Function(m[2]); }
      catch (e) {
        bad++;
        if (!firstErr) firstErr = '第 ' + lineAt(m.index) + ' 行起的脚本块：' + e.message;
      }
    }
    var cssOpen = (text.match(/<style\b/gi) || []).length, cssClose = (text.match(/<\/style>/gi) || []).length;
    var divOpen = (text.match(/<div\b/gi) || []).length, divClose = (text.match(/<\/div>/gi) || []).length;
    var warn = [];
    if (cssOpen !== cssClose) warn.push('style 标签 ' + cssOpen + ' 开 / ' + cssClose + ' 闭');
    if (divOpen !== divClose) warn.push('div 标签 ' + divOpen + ' 开 / ' + divClose + ' 闭');
    if (bad) {
      srcSay('✘ ' + bad + '/' + total + ' 个脚本块有语法错误 —— ' + firstErr, 'err');
    } else {
      srcSay('✓ ' + total + ' 个脚本块全部通过' + (warn.length ? ' · 注意 ' + warn.join('，') : ''), warn.length ? '' : 'ok');
    }
  }

  function srcFind() {

  /* ---- 文件清单：仓库里所有代码文件都列出来（含 versions 备份） ---- */
  var CODE_EXT = /\.(html|htm|js|css|json|py|md|sql|txt|webmanifest)$/i;
  var ROOT_ORDER = ['index.html', 'game.html', 'S1.html', 'dev.html'];
  var allFiles = null;

  function grpOf(p) {
    if (p.indexOf('versions/') === 0) return 'versions 备份';
    if (p.indexOf('/') < 0) return '根目录';
    return '其它';
  }
  function sortFiles(list) {
    var g = {};
    list.forEach(function (p) { var k = grpOf(p); (g[k] = g[k] || []).push(p); });
    Object.keys(g).forEach(function (k) {
      g[k].sort(function (a, b) {
        var ia = ROOT_ORDER.indexOf(a), ib = ROOT_ORDER.indexOf(b);
        if (ia >= 0 || ib >= 0) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
        return b.localeCompare(a, 'zh');   /* versions 里新的排前面 */
      });
    });
    return g;
  }

    var g = sortFiles(list), order = ['根目录', 'versions 备份', '其它'], html = '';
    order.forEach(function (k) {

      html += '<optgroup label="' + k + '（' + g[k].length + ' 个）">' +
        g[k].map(function (p) {

      || '<option value="game.html">game.html</option>';

  function loadFileList(force) {
    if (allFiles && !force) return Promise.resolve(allFiles);

      var out = [];

      });
      if (!out.length) throw new Error('空');
      return out;
    }).catch(function () {
      /* 没填 Token：退回静态目录索引，照样能列出全部备份 */

      }).catch(function () { return base; });

  /* ---- 正式网址打开哪个文件（存云端 __dev_route，立即生效） ---- */

    if (!name) return;
    name = name.trim();
    if (!/^[A-Za-z0-9_-]+\.html$/i.test(name)) { srcSay('文件名不合法：只能英文/数字/横线 + .html', 'err'); return; }
    if ((allFiles || []).indexOf(name) >= 0) { srcSay(name + ' 已经存在，换一个名字', 'err'); return; }
    var hasContent = srcBase && srcEls.ta.value && srcEls.ta.value !== '加载中…';
    var copy = hasContent && confirm('以当前编辑器内容（' + srcEls.file.value + '）为模板新建？\n取消 = 建一个空白页面');
    var text = copy ? srcEls.ta.value :
      '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>' + name.replace(/\.html$/i, '') + '</title>\n</head>\n<body>\n<script>\n(function () {\n  \'use strict\';\n})();\n</' + 'script>\n</body>\n</html>\n';
    btn.disabled = true;
    srcSay('创建 ' + name + ' …');
    ghCommit([{ path: name, text: text }], 'dev.html 新建页面 ' + name).then(function () {
      btn.disabled = false;
      allFiles = null;
      return loadFileList(true).then(function () {
        if ((allFiles || []).indexOf(name) >= 0) srcEls.file.value = name;
        srcLoaded = '';
        srcLoad(name, true);
        srcSay('✔ 已创建 ' + name + ' · Pages 构建后（30~90 秒）即可访问', 'ok');
        toast('已创建 ' + name, 'ok');
      });
    }).catch(function (e) { btn.disabled = false; srcSay('创建失败：' + e.message, 'err'); });
  }

  /* ---- 口令门 & 开合 ---- */
  function srcOpen() {
    srcEls.mask.classList.add('on');
    if (sessionStorage.getItem('dev_src_ok') !== '1') {
      srcEls.gate.classList.add('on');
      setTimeout(function () { document.getElementById('srcpass').focus(); }, 60);
      return;
    }
    loadFileList().then(function () { srcLoad(srcEls.file.value, true); });
    routeLoad();
  }
  function srcGateTry() {
    var v = document.getElementById('srcpass').value || '';
    var m = document.getElementById('srcgate-msg');
    if (v === SRC_PASS) {
      sessionStorage.setItem('dev_src_ok', '1');
      m.textContent = '';
      document.getElementById('srcpass').value = '';
      srcEls.gate.classList.remove('on');
      loadFileList().then(function () { srcLoad(srcEls.file.value, true); });
      routeLoad();
    } else {
      m.textContent = '口令不对，源码编辑没开';
    }
  }
  function srcClose() {
    if (srcEls.ta.value !== srcBase && srcBase) {
      if (!confirm('有未同步的改动，确定关闭？（改动会丢失）')) return;
    }
    srcEls.mask.classList.remove('on');
    srcEls.gate.classList.remove('on');
  }

  document.getElementById('btn-src').addEventListener('click', srcOpen);
  document.getElementById('srcclose').addEventListener('click', srcClose);
  document.getElementById('srcgate-cancel').addEventListener('click', function () {
    srcEls.gate.classList.remove('on');
    srcEls.mask.classList.remove('on');
  });
  document.getElementById('srcgate-ok').addEventListener('click', srcGateTry);
  document.getElementById('srcpass').addEventListener('keydown', function (e) { if (e.key === 'Enter') srcGateTry(); });
  document.getElementById('srcpull').addEventListener('click', function () {
    srcLoaded = '';
    srcLoad(srcEls.file.value, true);
  });
  document.getElementById('srccheck').addEventListener('click', srcCheck);
  document.getElementById('srcfind').addEventListener('click', srcFind);
  document.getElementById('srcdl').addEventListener('click', srcDownload);
  document.getElementById('routeapply').addEventListener('click', function () { routeApply(this); });
  document.getElementById('srcnew').addEventListener('click', function () { srcNew(this); });
  /* 快速切换按钮（源头 S1 / 正式服 / 入口页） */
  function markQuick() {
    Array.prototype.forEach.call(document.querySelectorAll('.srcquick [data-qf]'), function (el) {
      if (el.getAttribute('data-qf') === srcEls.file.value) el.className = 'cur'; else el.className = '';
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.srcquick [data-qf]'), function (el) {
    el.addEventListener('click', function () {
      var f = el.getAttribute('data-qf');
      if (!allFiles || allFiles.indexOf(f) < 0) { srcSay('文件列表还没加载好，稍等一下', 'err'); return; }
      if (srcEls.ta.value !== srcBase && srcBase && !confirm('当前有未同步的改动，切换会丢失，继续？')) return;
      srcEls.file.value = f;
      srcLoaded = '';
      srcLoad(f, true);
    });
  });
  document.getElementById('srcpush').addEventListener('click', function () { srcPush(this); });
  srcEls.file.addEventListener('change', function () {
    if (srcEls.ta.value !== srcBase && srcBase && !confirm('切换文件会丢掉当前未同步的改动，继续？')) {
      srcEls.file.value = srcLoaded || 'S1.html';
      return;
    }
    srcLoad(srcEls.file.value, true);
  });
  srcEls.ta.addEventListener('input', srcRefreshGutter);
  srcEls.ta.addEventListener('scroll', srcScrollSync);
  srcEls.ta.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = this.selectionStart, en = this.selectionEnd;
      this.value = this.value.slice(0, s) + '  ' + this.value.slice(en);
      this.selectionStart = this.selectionEnd = s + 2;
      srcRefreshGutter();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      document.getElementById('srcpush').click();
    }
  });
  /* Token 只存本机浏览器，不写进页面（页面是公开的） */
  try { var _t = localStorage.getItem(TOK_LS); if (_t) srcEls.tok.value = _t; } catch (e) {}
  srcEls.tok.addEventListener('change', function () {
    try { localStorage.setItem(TOK_LS, this.value.trim()); } catch (e) {}
  });

  /* ---------- 控制台自身更新检测（对比 GitHub 上的 DEV_VERSION） ---------- */
  var UPD_MIRRORS = [
    'https://honglang162.github.io/3/dev.html',
    'https://raw.githubusercontent.com/honglang162/3/master/dev.html'
  ];
  var updPending = '';
  /* 版本号比较：'W16.100c' > 'W16.99c' 这类也能比对 */
  function verNewer(a, b) {
    var pa = String(a).replace(/^v/i, '').split(/[.\-]/), pb = String(b).replace(/^v/i, '').split(/[.\-]/);
    for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
      var x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
      if (x !== y) return x > y;
    }
    return String(a) > String(b);
  }
  function updBtnReset() {
    var b = document.getElementById('btn-upd');
    b.disabled = false;
    b.textContent = updPending ? '⇡ 更新到 ' + updPending : '⇡ 检查更新';
    b.className = 'refresh mla' + (updPending ? ' acc' : '');
  }
  function checkUpdate(manual) {
    var b = document.getElementById('btn-upd');
    b.disabled = true;
    b.textContent = '检查中…';
    var i = 0;
    function tryNext() {
      if (i >= UPD_MIRRORS.length) return done('');
      var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
      var tm = ctl ? setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 10000) : null;
      fetch(UPD_MIRRORS[i++] + '?t=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
        .then(function (r) {
          if (tm) clearTimeout(tm);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (t) {
          var m = t.match(/DEV_VERSION\s*=\s*'([^']+)'/);
          return done(m ? m[1] : '');
        })
        .catch(function () { if (tm) clearTimeout(tm); return tryNext(); });
    }
    function done(remote) {
      updPending = '';
      if (!remote) {
        updBtnReset();
        if (manual) toast('检查失败：网络打不到 GitHub，稍后再试', 'err');
        return;
      }
      if (remote === DEV_VERSION) {
        updBtnReset();
        if (manual) toast('已是最新版本 v' + DEV_VERSION, 'ok');
        return;
      }
      if (!verNewer(remote, DEV_VERSION)) {
        updBtnReset();
        if (manual) toast('本地 v' + DEV_VERSION + ' 比线上 v' + remote + ' 还新，无需更新', 'ok');
        return;
      }
      /* 有新版本：按钮变蓝，再点一下就跳到最新版 */
      updPending = remote;
      updBtnReset();
      toast('控制台有新版本 v' + remote + '（当前 v' + DEV_VERSION + '）· 点「⇡ 更新到 ' + remote + '」立即升级', 'ok');
    }
    tryNext();
  }
  document.getElementById('btn-upd').addEventListener('click', function () {
    if (updPending) { location.href = 'https://honglang162.github.io/3/dev.html?upd=' + Date.now(); return; }
    checkUpdate(true);
  });

  /* W16.86：去掉密码门 —— 控制台页面直接进入，口令只在游戏设置视野页入口那里验证 */
  function boot() {
    document.getElementById('hdr-ver').textContent = 'v' + DEV_VERSION;
    loadDefs().then(fetchAll);
    setTimeout(function () { checkUpdate(false); }, 2500);   /* 打开后自动查一次新版本 */
  }
  boot();
})();
</script>
</body>

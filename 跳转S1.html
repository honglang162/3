<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>S1 正式服已上线</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 50% -10%, #14324a 0%, #0a1626 55%, #060e1a 100%);
    color:#cbd5e1; }
  .card { position:relative; width:min(480px,94vw); border-radius:20px; padding:42px 32px 34px; text-align:center;
    background:linear-gradient(160deg,#0d1b2e,#0a1424 55%,#101c30);
    box-shadow:0 0 0 1px rgba(94,234,212,.22), 0 0 50px rgba(45,212,191,.16), 0 26px 70px rgba(0,0,0,.65); }
  .card::before { content:''; position:absolute; inset:-1px; border-radius:21px; padding:1px; pointer-events:none;
    background:linear-gradient(120deg,#2dd4bf,#818cf8,#e879f9,#2dd4bf);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; }
  .badge { display:inline-block; font-size:11px; letter-spacing:.32em; color:#5eead4; padding:5px 16px 5px 20px;
    border:1px solid rgba(94,234,212,.4); border-radius:999px; background:rgba(45,212,191,.08); margin-bottom:18px; }
  h1 { font-size:30px; font-weight:800; letter-spacing:.24em; margin-bottom:10px;
    background:linear-gradient(100deg,#5eead4,#a5b4fc 55%,#f0abfc);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:15px; color:#9db7cc; line-height:1.9; margin-bottom:26px; }
  .sub b { color:#5eead4; }
  .go { display:block; width:100%; min-height:56px; border:none; border-radius:14px; cursor:pointer;
    font-size:17px; font-weight:700; letter-spacing:.14em; color:#04121c;
    background:linear-gradient(100deg,#2dd4bf,#38bdf8); box-shadow:0 8px 26px rgba(45,212,191,.35);
    -webkit-tap-highlight-color:transparent; }
  .go:active { transform:translateY(1px); }
  .tip { font-size:11.5px; color:#64748b; margin-top:18px; line-height:1.8; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">S1 赛季 · 源头</div>
    <h1>正式服已上线</h1>
    <p class="sub">S1 测试服已经结束测试，<b>正式服「源头」提前上线</b>！<br>现在就可以去玩正式服了。</p>
    <button class="go" id="go" type="button">🚀 进入正式服</button>
    <p class="tip">账号与正式服通用，直接登录即可<br>进度独立保存，测试数据已清档</p>
  </div>
  <script>
    document.getElementById('go').addEventListener('click', function () {
      location.replace('S1.html');
    });
  </script>
</body>
</html>

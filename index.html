<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>三角形突围</title>
<style>
  html,body{margin:0;height:100%;background:#060b14;color:#dbe4f0;
    font:14px/1.6 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;}
  #box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  h1{font-size:20px;letter-spacing:.28em;margin:0;
     background:linear-gradient(180deg,#e8f4ff,#38bdf8);-webkit-background-clip:text;background-clip:text;
     -webkit-text-fill-color:transparent}
  p{margin:0;color:#5b7c90;font-size:12px;letter-spacing:.1em}
  .bar{width:132px;height:2px;background:#12202f;overflow:hidden;border-radius:2px}
  .bar i{display:block;height:100%;width:38%;background:#38bdf8;animation:run 1s infinite ease-in-out}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}
</style>
</head>
<body>
<div id="box">
  <h1>三角形突围</h1>
  <div class="bar"><i></i></div>
  <p id="tip">正在接入…</p>
</div>
<script>
/* ==========================================================================
   入口跳转页（W16.99）
   正式网址 «/» 打开哪个文件，由开发者控制台的「正式网址打开」开关决定，
   目标存在云端 saves 表的 __dev_route 行，改完立即生效，不用重新发布。
   读不到配置 / 超时 → 一律回落到 game.html，保证玩家永远进得去。
   ========================================================================== */
(function () {
  'use strict';
  var SB_URL = 'https://a189ce61ac0be9d3b.app.workbuddy.host';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ1bmJhc2UiLCJyb2xlIjoiYW5vbiIsInByb2plY3QiOiJwXzdmNDFjZWY5ZWEwNCIsInJlZiI6ImIxZWU0ZjRlNTkwMSIsImlhdCI6MTc5NDgzMjk0MX0.vCVpMj1yW-uv2uum4H5DBI5uQ7yc6S1DqFMAG6Mhj1k';
  var SB_SHARE = 'DRZDPQLGJC';
  var DEFAULT_TARGET = 'game.html';
  var jumped = false;

  function go(target) {
    if (jumped) return;
    if (!target || !/^[\w][\w\-./]*\.html$/i.test(target) || /(^|\/)index\.html$/i.test(target)) {
      target = DEFAULT_TARGET;
    }
    jumped = true;
    location.replace(target + (location.search || ''));
  }

  /* W16.99b：本机缓存上次的目标（dev.html 切入口时会同源写这份缓存），
     有缓存立即跳转 —— 弱网/超时也不会再落回 game.html；
     没缓存才等网络（最多 4 秒），同时把结果写进缓存供下次秒开。 */
  var cached = null;
  try {
    cached = JSON.parse(localStorage.getItem('rt_cache') || 'null');
  } catch (e) { cached = null; }
  if (cached && cached.target) {
    go(cached.target);
    /* 后台静默刷新缓存，不改本次落点 */
    try {
      fetch(SB_URL + '/rest/v1/saves?user_id=eq.__dev_route&select=data&sharecode=' + SB_SHARE, {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }, cache: 'no-store'
      }).then(function (r) { return r.json(); }).then(function (rows) {
        var d = rows && rows[0] && rows[0].data;
        if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { d = null; } }
        var t = d && d.target;
        if (t && /^[\w][\w\-./]*\.html$/i.test(t) && !/(^|\/)index\.html$/i.test(t)) {
          localStorage.setItem('rt_cache', JSON.stringify({ target: t, ts: Date.now() }));
        }
      }).catch(function () {});
    } catch (e) {}
  } else {
    /* 首次使用：等网络，最多 4 秒 */
    var guard = setTimeout(function () { go(DEFAULT_TARGET); }, 4000);
    try {
      var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
      if (ctl) setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 3800);
      fetch(SB_URL + '/rest/v1/saves?user_id=eq.__dev_route&select=data&sharecode=' + SB_SHARE, {
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY },
        cache: 'no-store',
        signal: ctl ? ctl.signal : undefined
      }).then(function (r) { return r.json(); }).then(function (rows) {
        clearTimeout(guard);
        var d = rows && rows[0] && rows[0].data;
        if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { d = null; } }
        var t = (d && d.target) || DEFAULT_TARGET;
        try { localStorage.setItem('rt_cache', JSON.stringify({ target: t, ts: Date.now() })); } catch (e) {}
        go(t);
      }).catch(function () { clearTimeout(guard); go(DEFAULT_TARGET); });
    } catch (e) { clearTimeout(guard); go(DEFAULT_TARGET); }
  }
})();
</script>
</body>
</html>
